[Unit]
Description=ShareCreators Next.js application
After=network.target mysqld.service

[Service]
Type=simple
User=sharecreators-app
Group=sharecreators-app
WorkingDirectory=/www/wwwroot/sharecreators
Environment=NODE_ENV=production
Environment=PATH=/opt/laosiji-runtime/node-v22.16.0-linux-x64/bin:/usr/bin:/bin
ExecStart=/opt/laosiji-runtime/node-v22.16.0-linux-x64/bin/node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3040
Restart=on-failure
RestartSec=5
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
UMask=0027

[Install]
WantedBy=multi-user.target
